# gws-cuentas — configuración de ESTA máquina.
# Cópiala a ~/.config/gws-cuentas/cuentas.conf y edítala. No va al repositorio.
#
# Campos separados por «|». Las rutas pueden empezar por ~ o $HOME y pueden llevar espacios.
# Las tildes tienen que estar escritas igual que en el disco (normalmente NFC):
# «gcuenta doctor» avisa si una regla apunta a una carpeta que no existe.

# Nombre de la máquina. La credencial OAuth de esta máquina se llama gws-<maquina> y lleva el
# MISMO nombre en todas las cuentas: identifica la máquina, no la cuenta ni el proyecto
# (p. ej. gws-portatil-casa, gws-macmini-oficina).
maquina|portatil-casa

# cuenta|<id>|<email>|<proyecto_gcp>|<workspace|personal>
#   id: minúsculas, cifras y guiones. El proyecto puede quedar vacío hasta elegirlo.
#   personal = cuenta @gmail.com (menos scopes: sin Chat ni Admin).
cuenta|empresa|admin@empresa.example|empresa-proyecto|workspace
cuenta|asociacion|admin@asociacion.example||workspace
cuenta|personal|yo@gmail.com||personal

# Cuenta cuando ninguna regla coincide.
defecto|empresa

# ruta|<prefijo>|<id> — la carpeta y todo lo que cuelga de ella. Gana el prefijo más largo.
ruta|/mnt/shared/GoogleDrive/SharedDrives/Asociación|asociacion
ruta|/mnt/shared/GoogleDrive/SharedDrives/Estudios|personal
ruta|~/dev/asociacion|asociacion
ruta|~/dev/personal|personal

# Cuenta ligada a los conectores de claude.ai (Gmail, Drive, Calendar), si los usas.
# El hook avisa de que esos conectores no siguen las reglas de carpeta.
conectores|personal

# Navegador compartido (opcional). Por defecto: ~/.agent-browser/perfiles/google y el puerto 9300,
# solo en localhost. Cámbialo si ese puerto ya lo usa otra cosa.
# navegador|~/.agent-browser/perfiles/google|9300
